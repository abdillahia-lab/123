[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bahb"
version = "1.0.0"
description = "Autonomous Drone Inspection System for Data Centers & Substations"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "BAHB Team"}
]
keywords = [
    "drone",
    "inspection",
    "ai",
    "thermal",
    "infrastructure",
    "computer-vision",
    "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "Pillow>=10.2.0",
    "ultralytics>=8.1.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "safetensors>=0.4.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "scipy>=1.12.0",
    "jinja2>=3.1.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
full = [
    "onnxruntime-gpu>=1.17.0",
    "tensorrt>=8.6.0",
    "open3d>=0.18.0",
    "aiortc>=1.6.0",
    "weasyprint>=60.0",
    "paho-mqtt>=2.0.0",
    "redis>=5.0.0",
    "segment-anything-2>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
bahb = "bahb.main:cli_main"

[project.urls]
Homepage = "https://github.com/your-org/BAHB"
Documentation = "https://github.com/your-org/BAHB#readme"
Repository = "https://github.com/your-org/BAHB"

[tool.setuptools.packages.find]
where = ["."]
include = ["bahb*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
